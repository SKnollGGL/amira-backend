<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Alina Iute</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 800px;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
            margin: 5px 0;
        }

        .clear-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            margin-top: 8px;
            transition: background 0.2s;
        }

        .clear-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-content {
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .chat-input-area {
            padding: 15px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            background: #fafafa;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: #667eea;
        }

        .chat-input-area button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
        }

        .chat-input-area button:hover {
            background: #764ba2;
        }

        .loading {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .loading span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: bounce 1.4s infinite;
        }

        .loading span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% { opacity: 0.5; }
            40% { opacity: 1; }
        }

        .privacy-footer {
            font-size: 11px;
            padding: 15px;
            background: #f9f9f9;
            border-top: 1px solid #eee;
            color: #666;
            line-height: 1.4;
            border-radius: 0 0 12px 12px;
        }

        .privacy-footer a {
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Chat Alina Iute</h1>
            <p>Consultant administrativ - Cloppenburg, Germania</p>
            <button class="clear-btn" onclick="clearChatMemory()">🔄 Clear Memory</button>
        </div>

        <div class="chat-messages" id="chatMessages">
            <!-- Messages load here -->
        </div>

        <div class="chat-input-area">
            <input
                type="text"
                id="messageInput"
                placeholder="Scrie mesajul..."
                autocomplete="off"
            >
            <button onclick="sendMessage()">Trimite</button>
        </div>

        <div class="privacy-footer">
            <strong>⚖️ Legal:</strong> GDPR Compliant | EU AI Act |
            <a href="https://amiraconsulting.services/datenschutz" target="_blank">Datenschutz</a>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = "https://arisconsulting.app.n8n.cloud/webhook/alina-iute";
        const STORAGE_KEY = "alina_chat_messages";

        const messagesDiv = document.getElementById("chatMessages");
        const inputField = document.getElementById("messageInput");

        // Load saved messages on startup
        loadChatHistory();

        // Auto-focus input
        inputField.focus();

        inputField.addEventListener("keypress", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function loadChatHistory() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const messages = JSON.parse(saved);
                    messages.forEach(msg => {
                        addMessage(msg.text, msg.type);
                    });
                } else {
                    // First time - show greeting
                    addMessage("Bună! 👋 Sunt asistenta digitală a Alinei Iute.\n\nCu ce te pot ajuta astazi?", "bot");
                }
            } catch (e) {
                console.error("Error loading history:", e);
                addMessage("Bună! 👋 Sunt asistenta digitală a Alinei Iute.\n\nCu ce te pot ajuta astazi?", "bot");
            }
        }

        function saveChatHistory() {
            try {
                const messages = [];
                document.querySelectorAll('.message').forEach(el => {
                    const text = el.querySelector('.message-content').textContent;
                    const type = el.classList.contains('user') ? 'user' : 'bot';
                    messages.push({ text, type });
                });
                localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
            } catch (e) {
                console.error("Error saving history:", e);
            }
        }

        function clearChatMemory() {
            if (confirm("Clear all messages? This cannot be undone.")) {
                localStorage.removeItem(STORAGE_KEY);
                messagesDiv.innerHTML = "";
                addMessage("Bună! 👋 Sunt asistenta digitală a Alinei Iute.\n\nCu ce te pot ajuta astazi?", "bot");
                inputField.focus();
                console.log("✅ Chat memory cleared");
            }
        }

        async function sendMessage() {
            const message = inputField.value.trim();
            if (!message) return;

            addMessage(message, "user");
            inputField.value = "";
            inputField.focus();
            showTyping();
            saveChatHistory();

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: message,
                        timestamp: new Date().toISOString(),
                        channel: "website_chat"
                    })
                });

                const data = await response.json();
                removeTyping();

                let botReply = "Eroare de comunicare.";
                if (data.content && data.content[0]?.text) {
                    botReply = data.content[0].text;
                } else if (data.reply) {
                    botReply = data.reply;
                }

                addMessage(botReply, "bot");
                saveChatHistory();
            } catch (error) {
                removeTyping();
                console.error("Error:", error);
                addMessage("❌ Connection error. Try WhatsApp.", "bot");
            }
        }

        function addMessage(text, type) {
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${type}`;

            const content = document.createElement("div");
            content.className = "message-content";
            content.textContent = text;

            msgDiv.appendChild(content);
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showTyping() {
            const typingDiv = document.createElement("div");
            typingDiv.className = "message bot";
            typingDiv.id = "typing-indicator";

            const content = document.createElement("div");
            content.className = "message-content loading";
            content.innerHTML = "<span></span><span></span><span></span>";

            typingDiv.appendChild(content);
            messagesDiv.appendChild(typingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById("typing-indicator");
            if (typing) typing.remove();
        }

        // Clear memory on startup if requested
        console.log("💬 Chat loaded - Click 'Clear Memory' to reset");
    </script>
</body>
</html>
