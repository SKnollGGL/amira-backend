services:
  - type: web
    name: amira-aris-backend
    runtime: node
    plan: standard
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: APP_URL
        fromService:
          type: web
          property: url
      - key: ENCRYPTION_SALT
        scope: run
      - key: STRIPE_KEY
        scope: run
        value: sk_test_placeholder
      - key: STRIPE_WEBHOOK_SECRET
        scope: run
        value: whsec_test_placeholder
      - key: STRIPE_PUBLISHABLE_KEY
        scope: run
        value: pk_test_placeholder
      - key: STRIPE_PRICE_SOLO
        value: price_1234567890
      - key: STRIPE_PRICE_PRO
        value: price_0987654321
      - key: STRIPE_PRICE_ENTERPRISE
        value: price_5555555555
      - key: SUPABASE_URL
        scope: run
        value: https://diryethqkgdweamujrdu.supabase.co
      - key: SUPABASE_KEY
        scope: run
      - key: SUPABASE_JWT_SECRET
        scope: run
      - key: N8N_URL
        value: https://arisconsulting.app.n8n.cloud
      - key: N8N_API_KEY
        scope: run
      - key: TWILIO_ACCOUNT_SID
        scope: run
      - key: TWILIO_AUTH_TOKEN
        scope: run
      - key: TWILIO_FROM_VOICE
        value: "+19187237690"
      - key: TWILIO_FROM_WHATSAPP
        value: "whatsapp:+14155238886"
      - key: CLAUDE_API_KEY
        scope: run
      - key: GOOGLE_CLIENT_ID
        scope: run
      - key: GOOGLE_CLIENT_SECRET
        scope: run
      - key: GOOGLE_REDIRECT_URI
        fromService:
          type: web
          property: url
        value: "/api/oauth/callback/google"
      - key: HUBSPOT_CLIENT_ID
        scope: run
      - key: HUBSPOT_CLIENT_SECRET
        scope: run
      - key: HUBSPOT_REDIRECT_URI
        fromService:
          type: web
          property: url
        value: "/api/oauth/callback/hubspot"
      - key: CORS_ORIGINS
        value: "https://amiraconsulting.services,http://localhost:3000"
      - key: CORS_CREDENTIALS
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
